
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>NaijaClips 🇳🇬 | Share Your Videos</title>
<meta name="description" content="Watch and share videos with the NaijaClips community.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#181818;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:1px solid #333}
.logo{font-size:23px;font-weight:bold}.logo span{color:#00d084}
main{max-width:850px;margin:auto;padding:16px}
.panel,.video-card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:16px;margin-bottom:18px}
h1{font-size:26px}h2{font-size:19px}
p,.muted,small{color:#bdbdbd;line-height:1.5}
input,button{font:inherit;padding:12px;border-radius:8px}
input{display:block;width:100%;margin:8px 0 14px;background:#111;color:white;border:1px solid #444}
button{border:0;background:#00d084;color:#07150e;font-weight:bold;cursor:pointer;margin:3px}
.secondary{background:#333;color:white}
button:disabled{opacity:.5}
.status{white-space:pre-wrap;font-size:14px;margin:10px 0}
video{width:100%;max-height:600px;background:#000;border-radius:10px}
.video-title{font-weight:bold;font-size:18px;margin:12px 0}
.hidden{display:none!important}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
  <div class="logo">Naija<span>Clips</span> 🇳🇬</div>
  <button class="secondary" id="refresh">Refresh</button>
</header>

<main>
  <section class="panel">
    <h1>Welcome to NaijaClips!</h1>
    <p>Watch, discover and share videos with our community.</p>
    <div id="accountStatus" class="status">Connecting...</div>
  </section>

  <section class="panel" id="authPanel">
    <h2>Your account</h2>
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="email" placeholder="Enter your email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
    <button id="signIn">Sign in</button>
    <button id="signUp" class="secondary">Create account</button>
    <button id="signOut" class="secondary hidden">Sign out</button>
    <div id="authMessage" class="status" role="status"></div>
  </section>

  <section class="panel">
    <h2>Upload a video</h2>
    <p>Sign in before uploading. Maximum file size: 50 MB.</p>
    <label for="title">Video title</label>
    <input id="title" maxlength="150" placeholder="Give your video a title">
    <label for="file">Choose video</label>
    <input id="file" type="file" accept="video/*">
    <button id="upload">Upload video</button>
    <div id="uploadMessage" class="status" role="status"></div>
  </section>

  <section>
    <h2>Latest public videos</h2>
    <div id="feedMessage" class="status">Loading videos...</div>
    <div id="feed"></div>
  </section>
</main>

<footer>NaijaClips © <span id="year"></span> | Built for the community 🇳🇬</footer>

<script>
(() => {
  const SUPABASE_URL = "https://lvgpfbjajxytbfyeslcx.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_IodssB9DUB9stpFMi9rAjA_GSss5Dtn";

  const $ = id => document.getElementById(id);
  $("year").textContent = new Date().getFullYear();

  if (!window.supabase) {
    $("accountStatus").textContent = "Unable to load Supabase. Check your internet connection.";
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let user = null;
  let busy = false;

  function accountUpdate(nextUser) {
    user = nextUser;
    $("accountStatus").textContent = user
      ? "Signed in: " + user.email
      : "Browsing as a guest. Sign in to upload videos.";
    $("signIn").classList.toggle("hidden", !!user);
    $("signUp").classList.toggle("hidden", !!user);
    $("signOut").classList.toggle("hidden", !user);
  }

  async function auth(mode) {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      $("authMessage").textContent = "Enter your email and password.";
      return;
    }

    $("authMessage").textContent = "Please wait...";
    const result = mode === "signup"
      ? await db.auth.signUp({email, password})
      : await db.auth.signInWithPassword({email, password});

    if (result.error) {
      $("authMessage").textContent = result.error.message;
      return;
    }

    if (mode === "signup" && !result.data.session) {
      $("authMessage").textContent =
        "Account created. Check your email to confirm it, then sign in.";
    } else {
      $("authMessage").textContent = "Account request successful.";
    }

    accountUpdate(result.data.user || result.data.session?.user || null);
  }

  $("signIn").onclick = () => auth("signin");
  $("signUp").onclick = () => auth("signup");

  $("signOut").onclick = async () => {
    const {error} = await db.auth.signOut();
    $("authMessage").textContent = error ? error.message : "Signed out.";
    if (!error) accountUpdate(null);
  };

  db.auth.onAuthStateChange((_event, session) => {
    accountUpdate(session?.user || null);
  });

  async function loadFeed() {
    $("feedMessage").textContent = "Loading public videos...";
    $("feed").replaceChildren();

    const {data, error} = await db
      .from("videos")
      .select("id,title,video_url,thumbnail_url,created_at")
      .order("created_at", {ascending: false})
      .limit(50);

    if (error) {
      $("feedMessage").textContent =
        "Could not load videos: " + error.message +
        ". Check the videos table and its read policy.";
      return;
    }

    if (!data || data.length === 0) {
      $("feedMessage").textContent =
        "No public videos yet. Be the first to share one!";
      return;
    }

    $("feedMessage").textContent = data.length + " video(s) found.";

    data.forEach(item => {
      if (!item.video_url) return;

      const card = document.createElement("article");
      card.className = "video-card";

      const player = document.createElement("video");
      player.controls = true;
      player.playsInline = true;
      player.preload = "metadata";
      player.src = item.video_url;
      if (item.thumbnail_url) player.poster = item.thumbnail_url;

      const heading = document.createElement("div");
      heading.className = "video-title";
      heading.textContent = item.title || "Untitled video";

      const date = document.createElement("small");
      date.textContent = item.created_at
        ? new Date(item.created_at).toLocaleString()
        : "";

      card.append(player, heading, date);
      $("feed").append(card);
    });
  }

  $("refresh").onclick = loadFeed;

  $("upload").onclick = async () => {
    if (busy) return;

    if (!user) {
      $("uploadMessage").textContent = "Please sign in first.";
      return;
    }

    const file = $("file").files[0];
    const title = $("title").value.trim();

    if (!file) {
      $("uploadMessage").textContent = "Choose a video first.";
      return;
    }

    if (!file.type.startsWith("video/")) {
      $("uploadMessage").textContent = "Choose a valid video file.";
      return;
    }

    if (file.size > 50 * 1024 * 1024) {
      $("uploadMessage").textContent =
        "File exceeds 50 MB. Choose a smaller video.";
      return;
    }

    busy = true;
    $("upload").disabled = true;
    $("uploadMessage").textContent = "Uploading... Please keep this page open.";

    let uploadedPath = null;

    try {
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const path = user.id + "/" + crypto.randomUUID() + "-" + safeName;

      const {error: storageError} = await db.storage
        .from("clips")
        .upload(path, file, {contentType: file.type, upsert: false});

      if (storageError) throw storageError;
      uploadedPath = path;

      const {data: urlData} = db.storage.from("clips").getPublicUrl(path);

      const {error: rowError} = await db.from("videos").insert({
        user_id: user.id,
        title: title || file.name,
        video_url: urlData.publicUrl,
        thumbnail_url: null
      });

      if (rowError) {
        throw new Error(
          "The file uploaded, but its database record failed: " +
          rowError.message
        );
      }

      $("uploadMessage").textContent = "Video published successfully!";
      $("title").value = "";
      $("file").value = "";
      await loadFeed();

    } catch (error) {
      $("uploadMessage").textContent =
        "Upload failed: " + (error.message || "Unknown error") +
        (uploadedPath
          ? "\nThe file may already be in Storage. Check the database policy before retrying."
          : "");
    } finally {
      busy = false;
      $("upload").disabled = false;
    }
  };

  (async () => {
    const {data, error} = await db.auth.getSession();
    if (error) $("authMessage").textContent = error.message;
    accountUpdate(data?.session?.user || null);
    await loadFeed();
  })();
})();
</script>
</body>
</html>
