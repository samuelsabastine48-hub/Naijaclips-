
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#008751">
  <meta name="description" content="Discover, create and share videos from across Nigeria.">
  <title>NaijaClips 🇳🇬</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { color-scheme: dark; --green:#008751; --bg:#101010; --panel:#1c1c1c; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:white; font-family:Arial,sans-serif; }
    header { position:sticky;top:0;z-index:2;background:#151515;padding:16px;
      border-bottom:1px solid #303030; }
    .brand { color:#25d98a;font-size:25px;font-weight:800; }
    .tagline { color:#bbb;font-size:13px;margin-top:5px; }
    main { max-width:760px;margin:auto;padding:16px; }
    .panel { background:var(--panel);padding:16px;border-radius:14px;margin-bottom:18px; }
    h2 { font-size:18px;margin-top:0; }
    input,button { width:100%;padding:13px;border-radius:9px;margin-top:9px;
      font-size:15px; }
    input { background:#101010;color:white;border:1px solid #444; }
    button { border:0;background:var(--green);color:white;font-weight:bold;cursor:pointer; }
    button:disabled { opacity:.6; }
    .secondary { background:#333; }
    #status { font-size:14px;color:#ddd;line-height:1.5;overflow-wrap:anywhere; }
    .video-card { background:var(--panel);padding:12px;border-radius:14px;margin:16px 0; }
    video { display:block;width:100%;max-height:70vh;background:#000;border-radius:10px; }
    .video-title { font-weight:bold;margin:12px 0 5px;overflow-wrap:anywhere; }
    .date { color:#aaa;font-size:12px; }
    .empty { text-align:center;padding:30px 10px;color:#bbb; }
    footer { text-align:center;color:#888;font-size:12px;padding:24px; }
    a { color:#52dba0; }
  </style>
</head>
<body>
<header>
  <div class="brand">🇳🇬 NaijaClips</div>
  <div class="tagline">Discover. Create. Share.</div>
</header>

<main>
  <section class="panel">
    <h2>🎬 Share a video</h2>
    <input id="title" type="text" maxlength="150" placeholder="Give your video a title">
    <input id="videoFile" type="file" accept="video/*">
    <button id="uploadBtn">Upload video</button>
    <p style="font-size:12px;color:#aaa">Choose a video from your phone. Uploading requires the correct Supabase storage and database permissions.</p>
  </section>

  <section class="panel">
    <h2>📺 Video community</h2>
    <p id="status" role="status" aria-live="polite">Connecting to video feed...</p>
    <button id="refreshBtn" class="secondary">Refresh videos</button>
  </section>

  <section id="feed" aria-label="Public video feed">
    <div class="empty">Loading videos...</div>
  </section>
</main>

<footer>NaijaClips 🇳🇬 · Made for the Nigerian community</footer>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://lvgpfbjajxytbfyeslcx.supabase.co";
const SUPABASE_KEY = "sb_publishable_IodssB9DUB9stpFMi9rAjA_GSss5Dtn";
const BUCKET = "clips";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const statusBox = document.getElementById("status");
const feed = document.getElementById("feed");
const uploadBtn = document.getElementById("uploadBtn");

function setStatus(message) {
  statusBox.textContent = message;
}

function showError(action, error) {
  console.error("NaijaClips " + action + ":", error);
  setStatus(action + " failed: " + (error?.message || "Unknown error") +
    ". Check Supabase table, bucket and access policies.");
}

async function loadVideos() {
  setStatus("Connecting to video feed...");
  feed.replaceChildren();

  const { data, error } = await supabase
    .from("videos")
    .select("id, title, video_url, created_at")
    .eq("is_public", true)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    showError("Loading videos", error);
    feed.textContent = "Videos could not be loaded. See the error above.";
    return;
  }

  if (!data || data.length === 0) {
    setStatus("Connected. No public videos were found.");
    feed.innerHTML = '<div class="empty">No public videos yet. Be the first to share one!</div>';
    return;
  }

  setStatus("Connected · " + data.length + " video(s) loaded.");

  for (const item of data) {
    if (!item.video_url) continue;

    const card = document.createElement("article");
    card.className = "video-card";

    const player = document.createElement("video");
    player.controls = true;
    player.playsInline = true;
    player.preload = "metadata";
    player.src = item.video_url;

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = item.title || "NaijaClips video";

    const date = document.createElement("div");
    date.className = "date";
    date.textContent = item.created_at
      ? new Date(item.created_at).toLocaleString()
      : "";

    card.append(player, title, date);
    feed.append(card);
  }

  if (!feed.children.length) {
    feed.innerHTML = '<div class="empty">No playable video links were found.</div>';
  }
}

async function uploadVideo() {
  const file = document.getElementById("videoFile").files[0];
  const title = document.getElementById("title").value.trim();

  if (!file) {
    setStatus("Please select a video from your phone first.");
    return;
  }

  if (!file.type.startsWith("video/")) {
    setStatus("Please choose a valid video file.");
    return;
  }

  if (file.size > 100 * 1024 * 1024) {
    setStatus("This upload is over 100 MB. Choose a smaller video.");
    return;
  }

  uploadBtn.disabled = true;
  uploadBtn.textContent = "Uploading...";
  setStatus("Uploading your video. Please keep this page open...");

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = Date.now() + "-" +
      Math.random().toString(36).slice(2) + "-" + safeName;

    const { error: storageError } = await supabase.storage
      .from(BUCKET)
      .upload(path, file, { contentType: file.type, upsert: false });

    if (storageError) throw storageError;

    const { data: publicData } = supabase.storage
      .from(BUCKET)
      .getPublicUrl(path);

    const { error: insertError } = await supabase
      .from("videos")
      .insert({
        title: title || file.name,
        video_url: publicData.publicUrl,
        is_public: true
      });

    if (insertError) {
      setStatus("The file uploaded, but saving its video record failed: " +
        insertError.message +
        ". The uploaded file remains in storage; don't upload it again yet.");
      return;
    }

    document.getElementById("title").value = "";
    document.getElementById("videoFile").value = "";
    setStatus("Video uploaded successfully!");
    await loadVideos();
  } catch (error) {
    showError("Uploading video", error);
  } finally {
    uploadBtn.disabled = false;
    uploadBtn.textContent = "Upload video";
  }
}

uploadBtn.addEventListener("click", uploadVideo);
document.getElementById("refreshBtn").addEventListener("click", loadVideos);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(error => {
    console.warn("Service worker registration failed:", error);
  });
}

loadVideos();
</script>
</body>
</html>
